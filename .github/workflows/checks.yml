name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Static checks and browser integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vp run format:check
      - run: pnpm exec vp run lint
      - run: pnpm exec vp run typecheck
      - run: pnpm exec playwright install --with-deps chromium
      # The shared suite builds the site and starts its own preview server.
      - run: pnpm exec vp run test
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-evidence
          path: test-results/
          retention-days: 7
